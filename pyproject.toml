[project]
name = "goldeneye"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "python-multipart",
    "aiofiles",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.10",
    "numpy<2",
    "celery[redis]>=5.4",
    "redis>=5",
    "structlog>=24",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7",
    "websockets>=12",
    "python-dotenv",
    "pydantic-settings>=2",
    "sentry-sdk[fastapi]>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff",
    "black",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
