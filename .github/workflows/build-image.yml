name: Build & push API image to GHCR

# Builds the FastAPI + ONNX + OpenCV image and publishes it to GitHub Container
# Registry so DigitalOcean App Platform (Container image tab) can pull it.
# Image: ghcr.io/neuralmalkawii/goldeneye-api:latest

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "models/**"
      - "pyproject.toml"
      - "deploy/docker/api.Dockerfile"
      - "deploy/docker/start.sh"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/neuralmalkawii/goldeneye-api   # GHCR refs must be lowercase

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
